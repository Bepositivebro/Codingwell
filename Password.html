<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Security Analyzer</title>

    <style>
        body {
            background: #0b0b0b;
            color: #00ff99;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 420px;
            padding: 25px;
            border: 2px solid #00ff99;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0,255,153,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: black;
            border: 1px solid #00ff99;
            color: #00ff99;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0077ff;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0055cc;
        }

        .bar {
            width: 100%;
            height: 12px;
            background: #222;
            border-radius: 10px;
            margin-top: 6px;
            overflow: hidden;
        }

        #strengthBar {
            height: 100%;
            width: 0%;
            background: red;
            transition: width 0.4s ease;
        }

        .output {
            margin-top: 12px;
            font-size: 14px;
        }

        canvas {
            margin-top: 10px;
            border: 1px solid #00ff99;
        }

        .shloka {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #00ffaa;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Password Security Analyzer 🔐</h1>

    <input type="password" id="passwordInput" placeholder="Enter password">

    <label>
        <input type="checkbox" onclick="togglePasswordVisibility()"> Show Password
    </label>

    <button onclick="analyzePassword()">CHECK SECURITY</button>

    <div class="output" id="strengthText">Strength: —</div>
    <div class="bar">
        <div id="strengthBar"></div>
    </div>

    <div class="output" id="entropyOutput"></div>
    <div class="output" id="timeOutput"></div>
    <div class="output" id="breachOutput"></div>
    <div class="output" id="suggestions"></div>
    <div class="output" id="patternWarning"></div>
    <div class="output" id="passwordDNA"></div>

    <canvas id="hackerSim" width="360" height="60"></canvas>

    <div class="shloka">
        कर्णनेत्रं जागरूकं, यन्त्रे स्थापय रक्षणाय।<br>
        <em>"Install Karna’s vigilant eye in your system for protection."</em>
    </div>
</div>

<script src="scriptpassword.js"></script>
</body>
</html>
